<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You 🫶</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 2.2rem 1.2rem;
            border-radius: 24px;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.2), 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 340px;
            width: 88%;
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            position: relative;
            z-index: 10;
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }

        .heart-icon {
            font-size: 3.2rem;
            color: #ff3366;
            margin-bottom: 0.8rem;
            display: inline-block;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8)); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 25px rgba(255, 51, 102, 1)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8)); }
        }

            color: #ffffff;
            font-size: 1.55rem;
