<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>love</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Poppins",sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:url("background.png") center/cover no-repeat;
  overflow:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(2px);
  z-index:-1;
}

.container{
  text-align:center;
  width:100%;
  max-width:420px;
  padding:20px;
  opacity:0;
  transform:scale(0.95);
  transition:all .6s ease;
}

.container.active{
  opacity:1;
  transform:scale(1);
}

img{
  max-width:240px;
  margin-bottom:18px;
}

/* TEXT */
h1{
  font-size:26px;
  color:#222;
  min-height:36px;
  margin-bottom:25px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:18px;
}

button{
  padding:10px 28px;
  border:none;
  border-radius:999px;
  font-size:16px;
  cursor:pointer;
  transition:all .25s ease;
}

.yes{
  background:#ff9aa2;
  color:#fff;
  box-shadow:0 8px 20px rgba(255,154,162,.45);
}

.no{
  background:#ff6f91;
  color:#fff;
}

button:hover{
  transform:scale(1.06);
}

.hidden{ display:none; }

/* 🔹 FINAL MESSAGE BOX */
.message-box{
  background:rgba(255,255,255,0.9);
  padding:14px 22px;
  border-radius:16px;
  display:inline-block;
  font-size:22px;
  font-weight:600;
  color:#333;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
  animation:pop 0.6s ease forwards;
}

@keyframes pop{
  from{
    opacity:0;
    transform:translateY(10px) scale(0.95);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="container active" id="page1">
  <img src="rabbits.gif">
  <h1 id="typing"></h1>
  <div class="buttons">
    <button class="yes" onclick="goNext()">Yes</button>
    <button class="no" onclick="moveNo()">No</button>
  </div>
</div>

<!-- PAGE 2 -->
<div class="container hidden" id="page2">
  <img src="virtual-hug-sending-my-love.gif">
</div>

<!-- PAGE 3 -->
<div class="container hidden" id="page3">
  <img src="cat-farsi-hug.gif">
  <div class="message-box">I know you’ll always love me ❤️😍</div>
</div>

<script>
/* typing effect */
const text="Do you love me 🫶?";
let i=0;
const typing=document.getElementById("typing");

(function type(){
  if(i<text.length){
    typing.textContent+=text.charAt(i++);
    setTimeout(type,90);
  }
})();

function goNext(){
  page1.classList.remove("active");
  setTimeout(()=>{
    page1.classList.add("hidden");
    page2.classList.remove("hidden");
    page2.classList.add("active");
  },500);

  setTimeout(()=>{
    page2.classList.remove("active");
    page2.classList.add("hidden");
    page3.classList.remove("hidden");
    page3.classList.add("active");
  },3000);
}

function moveNo(){
  const btn=document.querySelector(".no");
  const x=(Math.random()*120)-60;
  const y=(Math.random()*120)-60;
  btn.style.transform=`translate(${x}px,${y}px)`;
}
</script>

</body>
</html>
