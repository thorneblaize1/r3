<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For You 🫶</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Fully transparent frosted glass container */
        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem 2rem;
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.25), 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 85%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 10;
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }

        .heart-icon {
            font-size: 4rem;
            color: #ff3366;
            margin-bottom: 1rem;
            display: inline-block;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 30px rgba(255, 51, 102, 1)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8)); }
        }

        h1 {
            color: #ffffff;
            font-size: 1.9rem;
            margin-bottom: 2.5rem;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 180px; 
            position: relative;
        }

        button {
            width: 110px;
            height: 48px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #yesBtn {
            background-color: #00f5d4; 
            color: #032525;
            position: absolute;
            left: calc(50% - 125px); 
            top: calc(50% - 24px);
            box-shadow: 0 0 25px rgba(0, 245, 212, 0.8), 0 5px 15px rgba(0,0,0,0.2);
        }

        #noBtn {
            background-color: #2b2d42; 
            color: #ffffff;
            position: absolute;
            left: calc(50% + 15px);  
            top: calc(50% - 24px);
            transition: left 0.15s cubic-bezier(0.25, 1, 0.5, 1), top 0.15s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            z-index: 999;
        }

        .success-message {
            display: none;
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 2.5rem 1rem;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="container" id="card">
        <div id="interactive-content">
            <div class="heart-icon">💖</div>
            <h1>Do you love me 🫶?</h1>
            <div class="btn-container" id="boxContainer">
                <button id="yesBtn">Yes</button>
                <button id="noBtn">No</button>
            </div>
        </div>
        <div class="success-message" id="successMsg">
            <div style="font-size: 4.5rem; margin-bottom: 1rem; filter: drop-shadow(0 0 15px rgba(255,255,255,0.6));">🥰✨</div>
            I love you too!<br>
            <span style="font-size: 1rem; color: #ffffffe0; font-weight: normal; margin-top: 10px; display: block; text-shadow: none;">(Notification sent successfully)</span>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const card = document.getElementById('card');
        const boxContainer = document.getElementById('boxContainer');
        const interactiveContent = document.getElementById('interactive-content');
        const successMsg = document.getElementById('successMsg');

        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1513127708719321189/7wzTrQfTvsTXPNxJoInbuiu4Obn7b8jKanm52Qnnag71A0zKA2piKocVpcQ44XljJusL';

        const patterns = [
            { left: 'calc(50% + 15px)', top: '10px' },
            { left: 'calc(50% - 55px)', top: '122px' },
            { left: 'calc(50% + 15px)', top: '122px' },
            { left: 'calc(50% - 55px)', top: '10px' },
            { left: 'calc(50% + 25px)', top: '65px' },
            { left: 'calc(50% - 115px)', top: '122px' },
            { left: 'calc(50% + 15px)', top: '10px' },
            { left: 'calc(50% - 120px)', top: '10px' }
        ];
        let currentPatternIndex = 0;

        function moveButton(e) {
            if (e) e.preventDefault();

            const nextMove = patterns[currentPatternIndex];
            noBtn.style.left = nextMove.left;
            noBtn.style.top = nextMove.top;

            currentPatternIndex = (currentPatternIndex + 1) % patterns.length;
        }

        noBtn.addEventListener('click', moveButton);

        // --- HTML5 Canvas Particle Engine ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 50 + 10; 
                this.size = Math.random() * 12 + 6;
                this.speedY = Math.random() * 1.5 + 1; 
                this.speedX = Math.sin(Math.random() * Math.PI) * 0.4;
                this.opacity = Math.random() * 0.6 + 0.4;
                this.color = `rgba(255, ${Math.floor(Math.random() * 80 + 120)}, ${Math.floor(Math.random() * 50 + 160)}, ${this.opacity})`;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < canvas.height * 0.7) {
                    this.opacity -= 0.002;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                const topCurveHeight = this.size * 0.3;
                ctx.moveTo(this.x, this.y + topCurveHeight);
                ctx.bezierCurveTo(this.x, this.y, this.x - this.size / 2, this.y, this.x - this.size / 2, this.y + topCurveHeight);
                ctx.bezierCurveTo(this.x - this.size / 2, this.y + (this.size + topCurveHeight) / 2, this.x, this.y + (this.size + topCurveHeight) / 2, this.x, this.y + this.size);
                ctx.bezierCurveTo(this.x, this.y + (this.size + topCurveHeight) / 2, this.x + this.size / 2, this.y + (this.size + topCurveHeight) / 2, this.x + this.size / 2, this.y + topCurveHeight);
                ctx.bezierCurveTo(this.x + this.size / 2, this.y, this.x, this.y, this.x, this.y + topCurveHeight);
                ctx.closePath();
                ctx.shadowColor = 'rgba(255, 105, 180, 0.5)';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            }
        }

        function handleParticles() {
            if (particlesArray.length < 45 && Math.random() < 0.1) {
                particlesArray.push(new Particle());
            }
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();

                if (particlesArray[i].y + particlesArray[i].size < 0 || particlesArray[i].opacity <= 0) {
                    particlesArray.splice(i, 1);
                    i--;
                }
            }
        }

        function animateLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            handleParticles();
            requestAnimationFrame(animateLoop);
        }
        animateLoop();

        yesBtn.addEventListener('click', () => {
            interactiveContent.style.display = 'none';
            successMsg.style.display = 'block';
            card.style.borderColor = 'rgba(255, 255, 255, 0.6)';
            card.style.boxShadow = '0 0 50px rgba(255, 255, 255, 0.6)';

            for(let k = 0; k < 30; k++) {
                let p = new Particle();
                p.y = Math.random() * canvas.height;
                p.speedY *= 2.5;
                particlesArray.push(p);
            }

            fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    embeds: [{
                        title: "💖 Huge Success!",
                        description: "She clicked **YES**, she loves you! 🫶",
                        color: 16724838, 
                        timestamp: new Date().toISOString()
                    }]
                })
            }).catch(err => console.error('Error sending webhook:', err));
        });
    </script>
</body>
</html>
